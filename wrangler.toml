name = "suiji-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# R2 绑定：绑定到现有的 lobe 桶（pc/ 667 张 + mobile/ 3068 张图片）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lobe"

# 可选配置（都有默认值）
# [vars]
# PC_DIR = "pc"           # 桌面端图片目录
# MOBILE_DIR = "mobile"   # 移动端图片目录
# LIST_CACHE_TTL = "300"  # 目录列表缓存秒数
