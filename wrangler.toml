name = "suiji-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# R2 绑定（必填）：把 <BUCKET_NAME> 换成你自己的 R2 桶名
# 桶里需要有两个目录：pc/（桌面图片）和 mobile/（移动图片）
# 也可以直接运行 ./deploy-cf.sh，脚本会自动创建桶并把绑定追加到这里
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "<BUCKET_NAME>"

# 可选配置（都有默认值）
# [vars]
# PC_DIR = "pc"           # 桌面端图片目录
# MOBILE_DIR = "mobile"   # 移动端图片目录
# LIST_CACHE_TTL = "300"  # 目录列表缓存秒数
#
# 防频繁下载（按 IP 限速，设 0 可关闭对应端点）
# RATE_LIMIT_RANDOM = "30"   # /api/random 每 IP 每 RATE_LIMIT_WINDOW 秒最多请求次数
# RATE_LIMIT_IMG    = "60"   # /img/* 每 IP 每窗口最多请求次数
# RATE_LIMIT_WINDOW = "60"   # 限速窗口（秒）
